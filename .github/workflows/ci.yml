name: Laravel CI/CD

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ==========================================
# Global Concurrency
# ==========================================

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


env:
  DOCKER_IMAGE: ismailbdcse/laravel-category-api


jobs:

  # ==========================================
  # JOB 1: Laravel Tests
  # ==========================================

  test:

    name: Laravel Tests

    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_sqlite
          coverage: none
          tools: composer
          cache: composer


      - name: Check PHP version
        run: php -v


      - name: Check Composer version
        run: composer --version


      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader


      - name: Prepare Laravel environment
        run: cp .env.example .env


      - name: Create SQLite database
        run: touch database/database.sqlite


      - name: Generate application key
        run: php artisan key:generate


      - name: Run migrations
        run: php artisan migrate --force


      - name: Run Laravel tests
        run: php artisan test


  # ==========================================
  # JOB 2: Build and Push Docker Image
  # ==========================================

  docker:

    name: Build and Push Docker Image

    needs:
      - test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================
  # JOB 3: Deploy to AWS EC2
  # ==========================================

  deploy:

    name: Deploy to AWS EC2

    needs:
      - docker

    runs-on: ubuntu-latest

    # IMPORTANT:
    # Never cancel an active production deployment.
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:

      - name: Deploy application to EC2

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: sha-${{ github.sha }}

        run: |

          set -e

          echo "=========================================="
          echo "Preparing SSH"
          echo "=========================================="

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key


          echo "=========================================="
          echo "Validating SSH private key"
          echo "=========================================="

          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null


          echo "=========================================="
          echo "Adding EC2 host key"
          echo "=========================================="

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


          echo "=========================================="
          echo "Testing SSH connection"
          echo "=========================================="

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'; hostname; whoami"


          echo "=========================================="
          echo "Starting deployment"
          echo "=========================================="

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "cd /opt/laravel-category-api && \
             echo 'Docker version:' && \
             docker --version && \
             echo 'Docker Compose version:' && \
             docker compose version && \
             echo 'Pulling image: $IMAGE_TAG' && \
             IMAGE_TAG=$IMAGE_TAG docker compose pull && \
             echo 'Starting containers...' && \
             IMAGE_TAG=$IMAGE_TAG docker compose up -d && \
             echo 'Waiting for containers...' && \
             sleep 10 && \
             docker compose ps"


          echo "=========================================="
          echo "Running Laravel migrations"
          echo "=========================================="

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "cd /opt/laravel-category-api && \
             IMAGE_TAG=$IMAGE_TAG docker compose exec -T app php artisan migrate --force"


          echo "=========================================="
          echo "Deployment completed"
          echo "=========================================="

          rm -f ~/.ssh/ec2_key


  # ==========================================
  # JOB 4: Production Verification
  # ==========================================

  verify:

    name: Verify Production

    needs:
      - deploy

    runs-on: ubuntu-latest

    steps:

      - name: Verify production application

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |

          set -e

          echo "=========================================="
          echo "Preparing SSH"
          echo "=========================================="

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


          echo "=========================================="
          echo "Checking containers"
          echo "=========================================="

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "cd /opt/laravel-category-api && \
             docker compose ps"


          echo "=========================================="
          echo "Checking Laravel"
          echo "=========================================="

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "cd /opt/laravel-category-api && \
             docker compose exec -T app php artisan --version"


          echo "=========================================="
          echo "Checking API"
          echo "=========================================="

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "curl -f http://localhost/api/categories"


          echo "=========================================="
          echo "Production verification successful"
          echo "=========================================="

          rm -f ~/.ssh/ec2_key